<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catgirl Tea Cafe</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Caveat', cursive;
}
#start-btn {
    background: #fff;
    color: #000;
    border: none;
    padding: 20px 60px;
    font-family: 'Caveat', cursive;
    font-size: 36px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(255,255,255,0.15);
    transition: all 0.15s ease;
    letter-spacing: 4px;
}
#start-btn:hover {
    background: #000;
    color: #fff;
    box-shadow: 0 0 50px rgba(255,255,255,0.3);
}
</style>
</head>
<body>
<button id="start-btn" onclick="location.href='game.html'">Начать</button>
</body>
</html>
