<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catgirl Tea Cafe — Game</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%;
    height: 100%;
    background: #000;
    font-family: 'Caveat', cursive;
    overflow: hidden;
}

#container {
    position: absolute;
    top: 1%;
    left: 1%;
    width: 98%;
    height: 98%;
    border: 2px solid #fff;
}

#chat-window {
    position: absolute;
    top: 10%;
    left: 2%;
    width: 380px;
    height: 600px;
    z-index: 1;

    background-image: url('ver%20v2.png');
    background-repeat: no-repeat;
    background-position: center;
    background-size: 100% 100%;

    display: flex;
    flex-direction: column;
    padding: 70px 50px 60px 50px;
    box-sizing: border-box;
}

#chat-header {
    color: #fff;
    padding: 6px 0;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 1px;
    text-align: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.4);
    margin-bottom: 12px;
}

#chat-messages {
    flex: 1;
    padding: 10px 4px 10px 8px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.message {
    background: none;
    color: #fff;
    padding: 8px 0;
    font-size: 17px;
    line-height: 1.6;
    word-wrap: break-word;
    text-align: left;
    animation: msg-in 0.2s ease;
}

@keyframes msg-in {
    0% { opacity: 0; transform: translateY(6px); }
    100% { opacity: 1; transform: translateY(0); }
}

#catgirl {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    transition: opacity 0.4s ease;
}

#right-panel {
    position: absolute;
    top: 34%;
    right: 9%;
    width: 14%;
    height: 32%;
    z-index: 1;
    border: none;
    background: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    font-family: 'Caveat', cursive;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 3px;
    transition: color 0.2s ease;
}
#right-panel:hover {
    color: #fff;
    text-shadow: 0 0 20px rgba(255,255,255,0.5);
}

#day-counter {
    position: fixed;
    top: 3%;
    right: calc(1% + 140px);
    background: url('dialogue window hor.png') no-repeat center/100% 100%;
    border: none;
    color: #fff;
    font-family: 'Caveat', cursive;
    font-size: 24px;
    font-weight: bold;
    padding: 5px 15px;
    z-index: 10;
    text-shadow: 0 0 5px rgba(0,0,0,0.5);
    text-align: center;
    pointer-events: none;
}

.nextday-btn {
    position: fixed;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    width: 260px;
    height: 70px;
    border: none;
    background: url('dialogue window hor.png') no-repeat center/100% 100%;
    color: #fff;
    font-size: 28px;
    font-weight: bold;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 20;
    transition: all 0.2s;
    letter-spacing: 3px;
    text-shadow: 0 0 5px rgba(0,0,0,0.5);
}
.nextday-btn:hover {
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
}

#volume-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 40px;
    height: 40px;
    z-index: 10;
    background: none;
    border: 2px solid #666;
    color: #666;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    border-radius: 4px;
    font-family: 'Caveat', cursive;
}
#volume-btn:hover { border-color: #fff; color: #fff; }
#volume-slider {
    position: fixed;
    bottom: 68px;
    right: 20px;
    width: 120px;
    height: 6px;
    z-index: 10;
    accent-color: yellow;
    display: none;
    cursor: pointer;
}
#volume-slider.show { display: block; }
</style>
</head>
<body>
<div id="container">
    <div id="chat-window">
        <div id="chat-header">Catgirl</div>
        <div id="chat-messages"></div>
    </div>

    <img id="catgirl" src="catgirl gif.gif" alt="catgirl">

    <div id="right-panel" onclick="location.href='cook.html'">Сварить</div>
    <div id="day-counter"></div>
    <div class="nextday-btn" id="nextday-btn">Следующий день</div>
    <button id="volume-btn">♪</button>
    <input type="range" id="volume-slider" min="0" max="100">
</div>

<script src="music.js"></script>
<script>
const REACTIONS = {
    happy: { img: 'happy catgirl.png', msgs: ['Ммм, вкуснятина! Спасибо!', 'Ты просто мастер!', 'Обожаю твой напиток!'] },
    mid:   { img: 'catgirl mid.png',   msgs: ['Ну, можно и так...', 'Пить можно.', 'Бывало и лучше.'] },
    angry: { img: 'catgirl angry.png',  msgs: ['Фу! Это не то!', 'Ты издеваешься?!', 'Я так не играю!'] },
};

const $catgirl = document.getElementById('catgirl');
const $chat = document.getElementById('chat-messages');

function addMessage(text) {
    const el = document.createElement('div');
    el.className = 'message';
    el.textContent = text;
    $chat.appendChild(el);
    $chat.scrollTop = $chat.scrollHeight;
}

const result = parseInt(localStorage.getItem('catgirlResult'));
localStorage.removeItem('catgirlResult');

let state = 'neutral';
let reactionMsgs = [];

if (!isNaN(result)) {
    if (result === 100) {
        state = 'happy';
    } else if (result >= 50) {
        state = 'mid';
    } else {
        state = 'angry';
    }
    $catgirl.style.opacity = '0';
    setTimeout(() => {
        $catgirl.src = REACTIONS[state].img;
        $catgirl.onload = () => { $catgirl.style.opacity = '1'; };
    }, 400);
    reactionMsgs = REACTIONS[state].msgs;
}

const introMsgs = [
    'Привет! Я сегодня так устала после работы...',
    'Можно мне чего-нибудь тёпленького?',
    'Ммм, как хорошо, что ты здесь!',
    'Сделаешь мне любимый напиток?',
    'Нажми на кофеварку справа, чтобы сварить мне кофе!',
];

const allMsgs = state === 'neutral' ? introMsgs : reactionMsgs;

allMsgs.forEach((text, i) => {
    setTimeout(() => addMessage(text), i * 1500);
});

function playAndGo(url) {
    location.href = url;
}

// Счетчик дней
function getDay() {
    return parseInt(localStorage.getItem('catgirlDay')) || 1;
}
const $dayCounter = document.getElementById('day-counter');
if ($dayCounter) $dayCounter.textContent = 'День ' + getDay();

// Показываем кнопку "Следующий день" только после результата варки
const $nextdayBtn = document.getElementById('nextday-btn');
if ($nextdayBtn && state !== 'neutral') {
    $nextdayBtn.style.display = 'flex';
    $nextdayBtn.addEventListener('click', () => {
        location.href = 'game.html';
    });
}

const volBtn = document.getElementById('volume-btn');
const volSlider = document.getElementById('volume-slider');
setVolumeUI(volSlider, volBtn);
</script>
</body>
</html>
