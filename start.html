<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catgirl Tea Cafe</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Caveat', cursive;
}
#start-btn {
    background: #fff;
    color: #000;
    border: none;
    padding: 20px 60px;
    font-family: 'Caveat', cursive;
    font-size: 36px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(255,255,255,0.15);
    transition: all 0.15s ease;
    letter-spacing: 4px;
}
#start-btn:hover {
    background: #000;
    color: #fff;
    box-shadow: 0 0 50px rgba(255,255,255,0.3);
}
#volume-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 40px;
    height: 40px;
    z-index: 5;
    background: none;
    border: 2px solid #666;
    color: #666;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    border-radius: 4px;
    font-family: 'Caveat', cursive;
}
#volume-btn:hover { border-color: #fff; color: #fff; }
#volume-slider {
    position: fixed;
    bottom: 68px;
    right: 20px;
    width: 120px;
    height: 6px;
    z-index: 5;
    accent-color: yellow;
    display: none;
    cursor: pointer;
}
#volume-slider.show { display: block; }
</style>
</head>
<body>
<button id="start-btn" onclick="location.href='game.html'">Начать</button>
<button id="volume-btn">♪</button>
<input type="range" id="volume-slider" min="0" max="100">
<script src="music.js"></script>
<script>
const volBtn = document.getElementById('volume-btn');
const volSlider = document.getElementById('volume-slider');
setVolumeUI(volSlider, volBtn);
</script>
</body>
</html>
